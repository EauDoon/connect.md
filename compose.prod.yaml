services:
  postgres:
    mem_limit: 256m
    cpus: "0.50"

  meilisearch:
    mem_limit: 384m
    cpus: "0.50"

  api:
    mem_limit: 384m
    cpus: "0.50"
    pids_limit: 128

  converter:
    mem_limit: 768m
    cpus: "0.75"
    pids_limit: 128

  search-projection-worker:
    mem_limit: 192m
    cpus: "0.25"
    pids_limit: 64

  search-admin:
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 64

  taxonomy-admin:
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 64

  exact-search-admin:
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 64

  search-key-bootstrap:
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64

  account-erasure-worker:
    mem_limit: 384m
    cpus: "0.35"
    pids_limit: 128

  frontend:
    mem_limit: 256m
    cpus: "0.40"
    pids_limit: 128

  nginx:
    mem_limit: 96m
    cpus: "0.25"
    pids_limit: 64
    ports:
      - "${CONNECTMD_HTTP_PORT:-80}:80"
      - "${CONNECTMD_HTTPS_PORT:-443}:443"

  certbot:
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    profiles: ["tls"]
    restart: "no"
    networks:
      - connectmd_app
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

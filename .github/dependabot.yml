# Dependency update proposals. Every pull request Dependabot opens runs the
# full CI (four required checks) and creates two Vercel preview deployments,
# so updates are weekly, grouped, and capped.
version: 2
updates:
  # Actions are pinned by full commit SHA in .github/workflows; Dependabot
  # proposes new SHAs (with the version comment) in one grouped pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tests pin these exactly (tests/browser-release-contract.test.ts and
      # tests/monaco-self-host-contract.test.ts); bump them deliberately
      # together with those assertions, never through an automated update.
      - dependency-name: "@playwright/test"
      - dependency-name: axe-core
      - dependency-name: monaco-editor
      # Framework majors are migrations, not dependency bumps.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  # No pip entry: apps/api installs from uv-generated, hash-locked,
  # Linux-only lock files (requirements.lock, requirements-test.lock) that are
  # regenerated by hand from requirements-build.in and pyproject.toml, and
  # tests pin their contents. Python updates go through that regeneration.

name: Release

# Manual release path: a maintainer pushes an annotated v* tag. The usual path
# is automatic: mint-source-tags.yml tags and releases VERSION after CI passes
# on main. Its tag is pushed with GITHUB_TOKEN, which does not trigger this
# workflow, so the two paths never both create the same Release.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          python3 tools/release_version.py check --tag "$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/release-notes.md"
          python3 tools/release_version.py notes --tag "$GITHUB_REF_NAME" --output "$notes"
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "connect.md ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes"

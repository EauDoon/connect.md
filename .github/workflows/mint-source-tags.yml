name: Mint source tags

# Tags and releases the current VERSION once CI has passed on main, so a
# release can never be published from a red commit. It also re-mints the two
# historical tags (v0.1.0, v0.2.0) if they are ever missing. The tag is pushed
# with GITHUB_TOKEN, which does not retrigger release.yml, so the Release is
# created here. Release notes come from the CHANGELOG section for VERSION via
# tools/release_version.py; a missing or inconsistent section fails this job.
# Fallback: `gh workflow run "Mint source tags" --ref main` mints at main HEAD.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: mint-source-tags
  cancel-in-progress: false

jobs:
  mint:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Mint annotated tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          notes="$RUNNER_TEMP/release-notes.md"

          mint() {
            local tag="$1"
            local sha="$2"
            local title="$3"
            if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
              echo "${tag} already exists on origin"
            else
              git tag -a "$tag" "$sha" -m "$title"
              git push origin "refs/tags/${tag}"
              echo "created ${tag} at ${sha}"
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release ${tag} already exists"
              return 0
            fi
            python3 tools/release_version.py notes --tag "$tag" --output "$notes"
            gh release create "$tag" --verify-tag --target "$sha" --title "connect.md ${tag#v}" --notes-file "$notes"
          }

          mint v0.1.0 55cfc6e6f0e80e7c657320cd9b455dfeadee65a1 "Release v0.1.0: pre-launch foundation"
          mint v0.2.0 512e4cdae0fcf58678c0cedee609e1cfea91536e "Release v0.2.0: publish source versioning"

          current="v$(tr -d '[:space:]' < VERSION)"
          case "$current" in
            v0.1.0|v0.2.0) echo "current VERSION ${current} is a historical pin" ;;
            v*)
              # Fails the job, instead of skipping, when VERSION, the
              # components, or the CHANGELOG section and links disagree.
              python3 tools/release_version.py check --tag "$current"
              mint "$current" "$TARGET_SHA" "connect.md ${current} source"
              ;;
          esac

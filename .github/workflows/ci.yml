name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: python tools/secret_scan.py

  platform-contract:
    name: Standalone Vercel contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Agent-client conformance
        run: |
          python examples/agent-clients/check_agent_client.py
          python -m unittest discover -s examples/agent-clients -p 'test_*.py' -q
      - run: python tools/check_standalone_site.py
      - name: Export and verify committed source distribution
        run: |
          archive="$RUNNER_TEMP/connectmd-source.tar.gz"
          python tools/source_distribution.py export --repo . --output "$archive"
          python tools/source_distribution.py verify --archive "$archive" --repo .

  backend:
    name: API checks (pytest, ruff, mypy, pip-audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-test.lock
      - name: Ruff lint
        run: ruff check .
      - name: mypy type check
        run: mypy app
      - name: pytest (unit only, skip integration)
        run: pytest -q -m "not integration" tests
      - name: pip-audit on production lockfile
        run: pip-audit --strict --requirement requirements.lock

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit
      - name: Generate and validate web dependency SBOM
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-sboms"
          npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > "$GITHUB_WORKSPACE/.ci-sboms/web.cdx.json"
          python3 ../../tools/check_dependency_sboms.py --kind web --lock package-lock.json --sbom "$GITHUB_WORKSPACE/.ci-sboms/web.cdx.json" --receipt "$GITHUB_WORKSPACE/.ci-sboms/web.receipt.json"
          cat "$GITHUB_WORKSPACE/.ci-sboms/web.receipt.json"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:e2e
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Audit dependency advisories
        run: |
          audit_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if timeout 120 npm audit "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }
          audit_with_retry
          audit_with_retry --omit=dev

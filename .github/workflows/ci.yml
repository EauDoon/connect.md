name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: python tools/secret_scan.py

  platform-contract:
    name: Standalone Vercel contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Agent-client conformance
        run: |
          python examples/agent-clients/check_agent_client.py
          python -m unittest discover -s examples/agent-clients -p 'test_*.py' -q
      - run: python tools/check_standalone_site.py
      - name: Export and verify committed source distribution
        run: |
          archive="$RUNNER_TEMP/connectmd-source.tar.gz"
          python tools/source_distribution.py export --repo . --output "$archive"
          python tools/source_distribution.py verify --archive "$archive" --repo .
      # VERSION, the web and API component versions, and the CHANGELOG section
      # and compare links must agree, so a version bump cannot merge half done.
      - name: Release metadata consistency
        run: python tools/release_version.py check
      # Runs after the export so the exporter sees a clean checkout. The
      # retained platform checker and its two test modules are not gated:
      # they carry known drift (see docs/platform/README.md).
      - name: Repository tooling tests
        run: >-
          python -m unittest -v
          tools.tests.test_source_distribution
          tools.tests.test_check_dependency_sboms
          tools.tests.test_module_size_ratchets
          tools.tests.test_with_network_secrets
          tools.tests.test_secret_scan
          tools.tests.test_release_version

  backend:
    name: API checks (pytest, ruff, mypy, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Ruff lint
        run: ruff check .
      - name: mypy type check
        run: mypy app
      - name: pytest (unit only, skip integration)
        run: pytest -q -m "not integration" tests
      - name: pip-audit on production lockfile
        run: python -m pip_audit -r requirements.lock
      - name: Build pinned API image and verify offline native ingestion
        working-directory: .
        timeout-minutes: 15
        run: |
          docker build --file apps/api/Dockerfile --tag connectmd-api-native:ci .
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tools/check_native_ingest.py,target=/checks/check_native_ingest.py,readonly" \
            connectmd-api-native:ci python /checks/check_native_ingest.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connectmd_network_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    env:
      CONNECTMD_NETWORK_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/connectmd_network_test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit
      - name: Generate and validate web dependency SBOM
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-sboms"
          npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > "$GITHUB_WORKSPACE/.ci-sboms/web.cdx.json"
          python3 ../../tools/check_dependency_sboms.py --kind web --lock package-lock.json --sbom "$GITHUB_WORKSPACE/.ci-sboms/web.cdx.json" --receipt "$GITHUB_WORKSPACE/.ci-sboms/web.receipt.json"
          cat "$GITHUB_WORKSPACE/.ci-sboms/web.receipt.json"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:e2e
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Network browser journey against disposable PostgreSQL
        run: npm run test:network-e2e
      - name: Audit dependency advisories
        run: |
          # Only the production audit is enforced. A separate dev-audit
          # (npm audit without --omit=dev) was previously run too, but
          # it surfaced transitive dev-only advisories (notably
          # GHSA-vfj7-8cjw-p6xm in braces 3.0.3 via tailwindcss 3.x's
          # chokidar/micromatch chain) that have no published fix and
          # require a major tailwindcss migration to clear. The
          # production audit below catches what actually runs.
          audit_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if timeout 120 npm audit "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }
          audit_with_retry --omit=dev

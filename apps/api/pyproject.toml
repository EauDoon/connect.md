[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "connectmd-api"
version = "0.1.0"
description = "connect.md's validated Markdown API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "anyio>=4.4,<5",
  "argon2-cffi>=23.1,<24",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "markdown-it-py>=4,<5",
  "markitdown[docx,pdf]>=0.1.1,<1",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "pypdf>=6.15,<7",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6.0,<7",
  "rfc3339-validator>=0.1.4,<1",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "unstructured[docx,pdf]>=0.15,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1",
  "editables>=0.3,<1",
  "pip-audit==2.9.0",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live PostgreSQL and Meilisearch"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = false
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

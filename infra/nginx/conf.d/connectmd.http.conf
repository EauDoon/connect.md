upstream connectmd_api {
  server api:8000;
  keepalive 16;
}

upstream connectmd_frontend {
  server frontend:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;
  limit_conn per_ip 20;

  include /etc/nginx/connectmd-conf.d/snippets/security-headers.conf;
  include /etc/nginx/connectmd-conf.d/snippets/proxy-headers.conf;

  location = /nginx-health {
    access_log off;
    return 204;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    default_type text/plain;
    return 503 "TLS setup in progress\n";
  }
}

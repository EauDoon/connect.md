upstream connectmd_api {
  server api:8000;
  keepalive 16;
}

upstream connectmd_frontend {
  server frontend:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name __CONNECTMD_DOMAIN__;

  location = /nginx-health {
    access_log off;
    return 204;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://__CONNECTMD_DOMAIN__$request_uri;
  }
}

server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name __CONNECTMD_DOMAIN__;

  ssl_certificate /etc/letsencrypt/live/__CONNECTMD_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__CONNECTMD_DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;
  limit_conn per_ip 20;

  include /etc/nginx/connectmd-conf.d/snippets/security-headers.conf;
  include /etc/nginx/connectmd-conf.d/snippets/proxy-headers.conf;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Connectmd-Release-Tag "__CONNECTMD_RELEASE_TAG__" always;
  location = /nginx-health {
    access_log off;
    return 204;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /openapi.json { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /agent-readme.md { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /llms.txt { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /llms-full.txt { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /.well-known/agent-card.json { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location ^~ /.well-known/oauth-protected-resource { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /mcp { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location ^~ /mcp/ { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /a2a { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location ^~ /a2a/ { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location ^~ /schemas/ { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /v1 { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location ^~ /v1/ { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /docs { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location ^~ /docs/ { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location = /redoc { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }
  location ^~ /redoc/ { include /etc/nginx/connectmd-conf.d/snippets/api-proxy.conf; }

  location / {
    include /etc/nginx/connectmd-conf.d/snippets/proxy-headers.conf;
    # This location-level header prevents inheritance of server-level add_header
    # directives, so repeat the shared headers and HSTS alongside the frontend CSP.
    include /etc/nginx/connectmd-conf.d/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Connectmd-Release-Tag "__CONNECTMD_RELEASE_TAG__" always;
    # Next's static routes require inline hydration scripts. Keep that exception
    # on script elements only; inline event handlers and eval remain blocked.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://*.clerk.accounts.dev https://clerk.__CONNECTMD_DOMAIN__ https://*.protect.clerk.com https://challenges.cloudflare.com; script-src-elem 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://clerk.__CONNECTMD_DOMAIN__ https://*.protect.clerk.com https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com; font-src 'self' data:; connect-src 'self' https://*.clerk.accounts.dev https://clerk.__CONNECTMD_DOMAIN__ https://*.protect.clerk.com:* https://img.clerk.com; worker-src 'self' blob:; frame-src 'self' blob: https://challenges.cloudflare.com https://*.protect.clerk.com; manifest-src 'self'; media-src 'none'" always;
    proxy_pass http://connectmd_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
  }
}

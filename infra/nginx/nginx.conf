user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format connectmd_json escape=json
    '{"time":"$time_iso8601","method":"$request_method",'
    '"path":"$uri","protocol":"$server_protocol","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","request_id":"$request_id"}';
  access_log /var/log/nginx/access.log connectmd_json;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
